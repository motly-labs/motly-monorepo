<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heart burst — motly + GSAP</title>
    <!-- CodePen settings, JS: gsap, then https://cdn.jsdelivr.net/npm/@motly/gsap@0.1 -->
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../node_modules/@motly/gsap/dist/motly.iife.js"></script>
    <!-- CodePen CSS pane -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1b1025;
        font-family: system-ui, sans-serif;
        color: #f5e9ff;
      }
      .heart {
        font-size: 64px;
        line-height: 1;
        color: #6b5a78;
        background: none;
        border: 0;
        cursor: pointer;
        transition: color 0.2s;
      }
      .heart.liked { color: #ff4d6d; }
      main { text-align: center; }
      p { opacity: 0.6; }
    </style>
  </head>
  <body>
    <!-- CodePen HTML pane -->
    <main>
      <button type="button" class="heart" aria-label="Like" aria-pressed="false">♥</button>
      <p>Timeline sequencing: squash, then a ring, a pop and sparks.</p>
    </main>

    <!-- CodePen JS pane -->
    <script>
      // Loaded after GSAP, the script registers itself: no gsap.registerPlugin(Motly) needed.
      const { rand, each } = Motly;

      const ring = {
        kind: 'circle',
        radius: [10, 52],
        fill: 'none',
        stroke: ['#ff4d6d', '#ffb3c1'],
        strokeWidth: [12, 0],
        duration: 0.45,
        restAt: 0.3,
      };

      const sparks = {
        kind: 'burst',
        count: 14,
        radius: [30, 80],
        restAt: 0.4,
        children: {
          kind: 'circle',
          radius: [rand(3, 6), 0],
          fill: each(['#ff4d6d', '#ffd166', '#8338ec', '#3a86ff']),
          duration: rand(0.5, 0.8),
        },
      };

      const heart = document.querySelector('.heart');
      let like;

      heart.addEventListener('click', () => {
        const liked = heart.classList.toggle('liked');
        heart.setAttribute('aria-pressed', String(liked));
        // revert() clears a burst mid-flight and puts the scale back; kill() would leave it drawn.
        like?.revert();
        if (!liked) return;
        like = gsap
          .timeline()
          .to(heart, { scale: 0.6, duration: 0.12, ease: 'power2.in' })
          .shape(heart, { spec: ring })
          .to(heart, { scale: 1, duration: 0.6, ease: 'elastic.out(1.2, 0.4)' }, '<')
          .burst(heart, { spec: sparks }, '<0.05');
      });
    </script>
  </body>
</html>

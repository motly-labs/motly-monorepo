packages:
  - 'packages/*'
  - 'apps/*'

# Refuse to install on a Node outside package.json engines: everything runs on Node 24.
engineStrict: true

# `pnpm publish` waits up to 10 minutes for each version it publishes to be installable, so the
# release workflow's provenance check can read it at once.
publishWaitTimeout: 600000

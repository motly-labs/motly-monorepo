<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Firework — motly + GSAP ScrollTrigger</title>
    <!-- CodePen settings, JS: gsap, ScrollTrigger, then https://cdn.jsdelivr.net/npm/@motly/gsap@0.1 -->
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../node_modules/gsap/dist/ScrollTrigger.min.js"></script>
    <script src="../node_modules/@motly/gsap/dist/motly.iife.js"></script>
    <!-- CodePen CSS pane -->
    <style>
      body {
        margin: 0;
        background: #05081a;
        color: #cdd6ff;
        font-family: system-ui, sans-serif;
      }
      .note {
        height: 70vh;
        display: grid;
        place-items: center;
        font-size: 20px;
        opacity: 0.7;
      }
      .sky {
        position: relative;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(#05081a, #1a1f4a);
      }
      .rocket {
        position: absolute;
        bottom: 0;
        width: 6px;
        height: 18px;
        margin-left: -3px;
        border-radius: 3px;
        background: linear-gradient(#fff6c2, #ff7b00);
      }
    </style>
  </head>
  <body>
    <!-- CodePen HTML pane -->
    <div class="note">Scroll down: ScrollTrigger scrubs the show, back and forth.</div>
    <section class="sky">
      <div class="rocket" style="left: 25%"></div>
      <div class="rocket" style="left: 55%"></div>
      <div class="rocket" style="left: 80%"></div>
    </section>
    <div class="note">The bursts are painted inside the section, so they scroll with it.</div>

    <!-- CodePen JS pane -->
    <script>
      gsap.registerPlugin(ScrollTrigger);
      const { rand, each } = Motly;

      // A shell of 10 bursts of 24 sparks: 240 Elements, so 'auto' paints it on a canvas.
      const shell = (colors) => ({
        kind: 'burst',
        count: 10,
        radius: [0, 60],
        restAt: 0.4,
        children: {
          kind: 'burst',
          count: 24,
          radius: [0, rand(40, 70)],
          children: {
            kind: 'circle',
            radius: [rand(1.5, 3.5), 0],
            fill: each(colors),
            duration: rand(0.9, 1.5),
          },
        },
      });

      const [first, second, third] = gsap.utils.toArray('.rocket');
      // The section is the container: bursts scroll with it and are clipped by it.
      const inSky = { container: '.sky' };

      gsap
        .timeline({
          scrollTrigger: { trigger: '.sky', start: 'top top', end: '+=2500', scrub: 1, pin: true },
        })
        // Each rocket rises, then its shell opens where it stopped as the rocket fades.
        .to(first, { y: '-65vh', duration: 1, ease: 'power2.out' })
        .burst(first, { spec: shell(['gold', 'orangered']), ...inSky })
        .to(first, { opacity: 0, duration: 0.2 }, '<')
        .to(second, { y: '-75vh', duration: 1, ease: 'power2.out' }, '<0.3')
        .burst(second, { spec: shell(['deepskyblue', 'white']), ...inSky })
        .to(second, { opacity: 0, duration: 0.2 }, '<')
        .to(third, { y: '-55vh', duration: 1, ease: 'power2.out' }, '<0.2')
        .burst(third, { spec: shell(['deeppink', 'mediumpurple', 'gold']), ...inSky })
        .to(third, { opacity: 0, duration: 0.2 }, '<');
    </script>
  </body>
</html>
